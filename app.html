<title>IrrigaManager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Manrope:wght@400;600;700&display=swap">
<style>
:root{--page:#e4e9e5;--bg:#eef2ef;--sf:#fbfcfb;--sf2:#f3f6f4;--ln:#d3ddd5;--tx:#18261d;--tx2:#4b5d51;--tx3:#5f6f63;--ac:#1d6f82;--onac:#fff;--map:#e3ebe5;--ok:#22663b;--warn:#8f5608;--crit:#b4372d;--sel:#e2eee6;--rail:#173a28;--railtx:#e7f0ea;--railon:rgba(255,255,255,.16);--sh:rgba(24,38,29,.16);color-scheme:light;
--f:"Manrope",system-ui,Arial,sans-serif;--n:"Barlow Condensed","Arial Narrow",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0f1416;--bg:#151b1d;--sf:#1d2528;--sf2:#212b2e;--ln:#2f3a3e;--tx:#e8eef0;--tx2:#a9b7bc;--tx3:#8a989d;--ac:#4fb3c8;--onac:#0c1a1e;--map:#11171a;--ok:#6cc08b;--warn:#e0b252;--crit:#ec7d70;--sel:#24313a;--rail:#1d2528;--railtx:#e8eef0;--railon:#2a3539;--sh:rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--page:#0f1416;--bg:#151b1d;--sf:#1d2528;--sf2:#212b2e;--ln:#2f3a3e;--tx:#e8eef0;--tx2:#a9b7bc;--tx3:#8a989d;--ac:#4fb3c8;--onac:#0c1a1e;--map:#11171a;--ok:#6cc08b;--warn:#e0b252;--crit:#ec7d70;--sel:#24313a;--rail:#1d2528;--railtx:#e8eef0;--railon:#2a3539;--sh:rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--tx);font:14px/1.5 var(--f);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg{display:block}
.i{width:18px;height:18px;flex:none}
.shell{display:grid;grid-template-columns:86px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;background:var(--rail);color:var(--railtx);display:flex;flex-direction:column;gap:4px;padding:14px 6px calc(14px + env(safe-area-inset-bottom,0px))}
.rail .brand{display:grid;place-items:center;margin-bottom:10px;color:var(--ac)}
.rail .brand svg{width:28px;height:28px}
.rail button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;padding:8px 2px;border-radius:9px;opacity:.85;text-align:center;background:none;border:0;color:inherit;min-height:52px;justify-content:center}
.rail button svg{width:21px;height:21px}
.rail button.on{opacity:1;background:var(--railon);font-weight:700}
.rail button[disabled]{opacity:.38;cursor:not-allowed}
.rail .sp{flex:1}.rail .sh{display:none}
.main{min-width:0;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px 16px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-content:start}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.top h1{margin:0;font-size:22px;line-height:1.2}
.top .crumb{display:block}
.seg{display:inline-flex;border:1px solid var(--ln);border-radius:10px;overflow:hidden;background:var(--sf)}
.seg button{font-weight:600;font-size:13px;color:var(--tx2);background:none;border:0;padding:0 14px;min-height:38px}
.seg button[aria-pressed=true]{background:var(--ac);color:var(--onac)}
.banner{border:1px solid var(--ln);background:var(--sf);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--tx2);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{border-color:var(--warn)}
.banner b{color:var(--tx)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px 16px;min-width:0}
.card h3{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.card h3 small{font-weight:400;color:var(--tx3);font-size:12px}
.crumb{font-size:11.5px;color:var(--tx3);letter-spacing:.03em}
.muted{color:var(--tx3)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid currentColor;line-height:1.3;white-space:nowrap}
.pill:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.np:before{display:none}
.ok{color:var(--ok)}.warn{color:var(--warn)}.crit{color:var(--crit)}.mut{color:var(--tx3)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.b1,.b2,.b3{font-weight:700;font-size:13px;border-radius:10px;padding:0 14px;min-height:38px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--ac);background:none;color:var(--ac);text-decoration:none}
.b1{background:var(--ac);color:var(--onac)}
.b3{border-color:var(--crit);color:var(--crit)}
.b1[disabled],.b2[disabled]{opacity:.45;cursor:not-allowed}
.b1 svg,.b2 svg{width:15px;height:15px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.lk{background:none;border:0;color:var(--ac);font-weight:700;padding:0;text-decoration:underline;text-underline-offset:2px}
.n{text-align:right;font-family:var(--n);font-size:15.5px;font-variant-numeric:tabular-nums}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;color:var(--tx2);font-weight:600;height:34px;padding:0 10px;border-bottom:1px solid var(--ln);white-space:nowrap;background:var(--sf2)}
.t td{height:40px;padding:0 10px;border-bottom:1px solid var(--ln);white-space:nowrap}
.t th.n{font-family:var(--f);font-size:13px}
.t tr.sel td{background:var(--sel)}
.t tr[data-go]{cursor:pointer}
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:12px;background:var(--sf)}
.tw .t tr:last-child td{border-bottom:0}
.empty{padding:28px 16px;text-align:center;color:var(--tx2);display:grid;gap:10px;justify-items:center}
/* mapa */
.mapg{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.mapcard{padding:10px}
.maptop{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:2px 2px 10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700}
.mapbox{position:relative;border-radius:10px;overflow:hidden;background:var(--map)}
.mapbox img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.mapbox svg{position:absolute;inset:0;width:100%;height:100%}
.mapbox.ed svg{touch-action:none}
.mapbox path[data-p]{cursor:pointer}
.mapbox path[data-p]:focus-visible{outline:none;stroke:var(--ac);stroke-width:5}
.edbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:10px;font-size:13px;color:var(--tx2)}
.edbar label{display:inline-flex;gap:6px;align-items:center}
.edbar input,.edbar select{background:var(--sf);border:1px solid var(--ln);border-radius:8px;min-height:36px;padding:0 8px}
.tog{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--tx2);min-height:38px}
.tog input{width:18px;height:18px;accent-color:var(--ac)}
.side{display:grid;gap:12px;align-content:start;position:sticky;top:16px}
.ptitle{font-size:22px;font-weight:700;margin:0;line-height:1.15}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{border:1px solid var(--ln);border-radius:10px;padding:8px 4px;text-align:center;background:var(--bg)}
.kpi b{display:block;font:600 23px/1.1 var(--n)}
.kpi span{font-size:10.5px;color:var(--tx3);display:block;line-height:1.25}
.kpi.warn b{color:var(--warn)}.kpi.crit b{color:var(--crit)}
.sub{font-size:12px;color:var(--tx2);font-weight:700;margin:0;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.chart{width:100%;height:auto}
/* uniformidade */
.pv{display:flex;flex-wrap:wrap;gap:6px}
.pv button{border:1px solid var(--ln);border-radius:999px;padding:0 13px;min-height:36px;font-weight:600;font-size:12.5px;background:var(--sf);color:var(--tx2)}
.pv button.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}
.k5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.bn{font:600 36px/1.05 var(--n);margin:2px 0 6px;font-variant-numeric:tabular-nums}
.k8{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 16px}
.bn2{font:600 23px/1.1 var(--n)}
.bn2 small{font:12px var(--f);color:var(--tx3);margin-left:3px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:12px}
.g21{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px}
.leg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ins{margin:0;padding-left:20px;display:grid;gap:4px;color:var(--tx2)}
.sigbox{border-bottom:1.5px solid var(--tx2);min-height:96px;display:grid;align-items:end;color:var(--tx);margin:4px 0 8px}
.sigbox svg{width:100%;height:92px}
details.card summary{cursor:pointer;font-weight:700;font-size:14px}
details.card[open] summary{margin-bottom:10px}
/* formulários */
.form{display:grid;gap:12px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg .full{grid-column:1/-1}
.fl{display:grid;gap:4px;font-size:12px;font-weight:700;color:var(--tx2)}
.fl input,.fl select,.fl textarea{height:44px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--tx);padding:0 11px;font-weight:600;font-size:15px;width:100%;min-width:0}
.fl textarea{height:72px;padding:8px 11px;font-weight:400;font-size:14px;resize:vertical}
.fl input[inputmode=decimal],.fl input[type=number]{font-family:var(--n);font-size:18px}
.fl small{font-weight:400;color:var(--tx3)}
.note{font-size:12.5px;color:var(--tx2)}
.note.warn{color:var(--warn);font-weight:700}
.note.crit{color:var(--crit);font-weight:700}
/* modal e assistente */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:grid;place-items:center;padding:16px}
.dlg{background:var(--bg);border:1px solid var(--ln);border-radius:16px;width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px var(--sh)}
.dlg .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--ln);background:var(--sf);position:sticky;top:0;z-index:1}
.dlg .hd h2{margin:0;font-size:17px}
.dlg .bd{padding:16px;display:grid;gap:12px}
.dlg .ft{padding:12px 16px;border-top:1px solid var(--ln);background:var(--sf);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0}
.x{background:none;border:1px solid var(--ln);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;color:var(--tx2)}
.wiz{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:grid;place-items:center}
.wz{width:min(440px,100%);height:min(860px,100vh);background:var(--bg);display:grid;grid-template-rows:auto 1fr auto;border-radius:22px;overflow:hidden;border:1px solid var(--ln)}
.wbar{background:var(--rail);color:var(--railtx);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.wbar small{font-size:11.5px;opacity:.85;display:block}
.wbar b{font-size:16px}
.wbar .x{color:var(--railtx);border-color:rgba(255,255,255,.25)}
.wbody{overflow-x:hidden;padding:14px;display:grid;gap:12px;align-content:start;overflow:auto;grid-template-columns:minmax(0,1fr)}
.wfoot{padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ln);background:var(--sf);display:grid;gap:8px}
.wfoot .r{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.wfoot .b1,.wfoot .b2{min-height:50px;font-size:15px}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--ln)}
.steps i.on{background:var(--ac)}
.h5{margin:4px 0 0;font-size:12.5px;font-weight:700;color:var(--tx2)}
.prog{display:flex;justify-content:space-between;font-size:12.5px;color:var(--tx2)}
.trk{height:6px;border-radius:3px;background:var(--ln);overflow:hidden}.trk i{display:block;height:100%;background:var(--ac)}
.cn{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.cn b{font:600 34px var(--n)}.cn span{font-size:14px;color:var(--tx2);font-weight:700}
.big{height:60px!important;border:2px solid var(--ac)!important;font:600 30px var(--n)!important}
.res{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--ln);border-radius:10px;padding:8px 10px;background:var(--sf);font-size:13px}
.res b{font:600 19px var(--n);white-space:nowrap}
.foto{display:grid;grid-template-columns:84px 1fr;gap:10px;align-items:center;border:1px dashed var(--ln);border-radius:10px;padding:8px;background:var(--sf)}
.foto img,.foto .ph{width:84px;height:84px;border-radius:8px;object-fit:cover;background:var(--sf2);display:grid;place-items:center;color:var(--tx3)}
.grid30{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.grid30 button{min-height:36px;border-radius:8px;border:1px solid var(--ln);background:var(--sf);font:600 15px var(--n);color:var(--tx2)}
.grid30 button.d{background:var(--sel);color:var(--tx);border-color:var(--ok)}
.grid30 button.p{border-color:var(--crit);color:var(--crit);text-decoration:line-through}
.grid30 button.c{outline:2px solid var(--ac);outline-offset:1px}
.sigpad{width:100%;height:150px;border:1.5px dashed var(--ac);border-radius:10px;background:var(--sf);touch-action:none;display:block;cursor:crosshair}
.ck{display:grid;gap:10px}
.cki{border:1px solid var(--ln);border-radius:12px;background:var(--sf);padding:10px 12px;display:grid;gap:9px}
.cki.nc{border-color:var(--crit)}
.cki .tt{font-weight:700;font-size:14px;line-height:1.35;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.crit-tag{font-size:10.5px;font-weight:700;color:var(--crit);border:1px solid var(--crit);border-radius:6px;padding:0 6px;white-space:nowrap;line-height:1.6}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tri button{min-width:0;text-align:center;padding:0 6px;min-height:46px;border-radius:9px;border:1px solid var(--ln);background:var(--bg);font-weight:700;font-size:13px;color:var(--tx2)}
.tri button[aria-pressed=true].c{background:var(--ok);border-color:var(--ok);color:var(--onac)}
.tri button[aria-pressed=true].n{background:var(--crit);border-color:var(--crit);color:var(--onac)}
.tri button[aria-pressed=true].a{background:var(--tx3);border-color:var(--tx3);color:var(--bg)}
.ncbox{display:grid;gap:8px;border-top:1px dashed var(--ln);padding-top:9px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--ln)}
.mtx{border:1px solid currentColor;border-radius:999px;background:none;font-weight:700;font-size:11px;padding:2px 8px;min-width:56px;cursor:pointer;color:var(--tx3)}.mtx.ok{color:var(--ok)}.mtx.warn{color:var(--warn)}.mtx.crit{color:var(--crit);background:color-mix(in srgb,var(--crit) 14%,transparent)}.mtx.mut{border-color:transparent}
.t td.c,.t th.c{text-align:center}
.t tr.hdes td{background:color-mix(in srgb,var(--warn) 9%,transparent)}
.hbr{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:10px;align-items:center}
.hbr b{display:block;font-size:15px}.hbr small{display:block;font-size:12px;color:var(--tx3);margin-top:2px}
.hbr input{width:100%;height:46px;font-size:18px;text-align:right}
.hq .pill{margin-left:6px}
.hbm{font-size:12.5px;color:var(--tx2)}.hbm:empty{display:none}
.hbi.on{border-color:var(--ok)}.hbi.on .hbm{color:var(--ok)}.hbi.al{border-color:var(--warn)}.hbi.al .hbm{color:var(--warn)}.hbi.er{border-color:var(--crit)}.hbi.er .hbm{color:var(--crit)}
.irbad td{background:color-mix(in srgb,var(--crit) 8%,transparent)}
.irl input,.irl select{height:34px;padding:0 6px;font-size:13.5px;border:1px solid var(--ln);border-radius:8px;background:var(--sf);color:var(--tx);min-width:0}
.irl input[type=date]{width:132px}.irl select{max-width:112px}.irl td{padding:4px 5px!important;vertical-align:middle}.irl .irst{min-width:140px;white-space:normal}
.irst .pill{white-space:normal;line-height:1.25;height:auto;padding:3px 8px}
.irf{grid-template-columns:repeat(4,minmax(0,1fr))!important;max-width:820px}
.irch{width:100%;height:auto;display:block}.irb:hover path{filter:brightness(1.15)}
.leg i{display:inline-block;width:14px;height:10px;margin-right:6px;vertical-align:-1px}.leg .lgb{background:var(--ac);border-radius:3px}.leg .lgr{border-top:2px dashed var(--tx2);height:0;vertical-align:3px}
.hb{display:grid;gap:6px}.hbr2{display:grid;grid-template-columns:minmax(110px,190px) 1fr 120px;gap:10px;align-items:center;font-size:13.5px}
.hbl{color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hbt{height:14px;background:var(--sf2);border-radius:4px;overflow:hidden}.hbt i{display:block;height:100%;background:var(--ac);border-radius:0 4px 4px 0}.hbv{text-align:right;font-variant-numeric:tabular-nums}
.irt td,.irt th{white-space:nowrap}.irt tr.irtot td,.irt td.irtot{font-weight:700}.irt td.warn{color:var(--warn)}
.t.ct{table-layout:fixed;min-width:820px}.t.ct th:nth-child(2){width:128px}.t.ct th:nth-child(3){width:100px}.t.ct th:nth-child(4){width:200px}.t.ct th:nth-child(5){width:128px}.t.ct th:nth-child(6){width:112px}.t.ct td{white-space:normal}
.mtl{display:grid;gap:6px}
.mti{border:1px solid var(--ln);border-radius:10px;background:var(--sf);padding:8px 10px;display:grid;gap:8px}
.mti.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 8%,var(--sf))}
.mti>.mtc{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;font-weight:600;font-size:14px;line-height:1.35;cursor:pointer}
.mti>.mtc input{width:20px;height:20px;margin-top:1px;accent-color:var(--ac)}
.mti small{display:block;font-weight:400;font-size:12px;color:var(--tx3);margin-top:2px}
.cein{background:var(--sf);border:1px solid var(--ln);border-radius:8px;min-height:34px;padding:0 8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13.5px;max-width:calc(100vw - 32px);box-shadow:0 8px 24px var(--sh)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:1100px){.mapg{grid-template-columns:minmax(0,1fr)}.side{position:static}.k5{grid-template-columns:repeat(3,minmax(0,1fr))}.g2,.g21{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
 .shell{grid-template-columns:minmax(0,1fr)}
 .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;z-index:10;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));overflow-x:auto}
 .rail .brand,.rail .sp,.rail button[disabled]{display:none}
 .irf{grid-template-columns:1fr 1fr!important}.hbr2{grid-template-columns:96px 1fr 92px;font-size:12.5px}
 #main .seg{max-width:100%;min-width:0;flex:0 1 auto;overflow-x:auto;scrollbar-width:none}#main .seg button{white-space:nowrap;flex:0 0 auto}
 #cardHor .hp{display:none}#cardHor .hq .pill{margin-left:4px}
 .rail button{flex:1 1 0;min-width:44px;font-size:10px;padding:8px 0}.rail button[disabled]{display:none}.rail .lg{display:none}.rail .sh{display:inline}
 .main{padding-bottom:96px}
 .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
 .k5{grid-template-columns:repeat(2,minmax(0,1fr))}.k8{grid-template-columns:repeat(2,minmax(0,1fr))}
 .bn{font-size:30px}
 .wiz{place-items:stretch}.wz{width:100%;height:100%;border-radius:0;border:0}

<script>
(function(){'use strict';
/*IMGS*/

// ---------- constantes ----------
var NMAX=50;
var CFG0={diam:72,horAviso:7,fatorHid:10,avisoH:100,avisoDias:30,ventoMax:4.5,faixa:15,laminaRec:10,margem:5};
var AREA=['','RU','JD'];
// Só usados no modo local (fora do Claude), para a página funcionar sozinha.
var DEF_PIVOS=[
 {id:'p01',nome:'Pivô 01',area:1,x:105,y:538,r:103,o:60,q:['RU39','RU37','RU36','RU38']},
 {id:'p02',nome:'Pivô 02',area:1,x:310,y:416,r:132,o:63,q:['RU43','RU41','RU40','RU42']},
 {id:'p03',nome:'Pivô 03',area:1,x:488,y:251,r:102,o:45,q:['RU47','RU45','RU44','RU46']},
 {id:'p04',nome:'Pivô 04',area:1,x:643,y:418,r:118,o:45,q:['RU51','RU49','RU48','RU50']},
 {id:'p05',nome:'Pivô 05',area:2,x:825,y:283,r:82,o:45,q:['JD04','JD02','JD01','JD03']},
 {id:'p06',nome:'Pivô 06',area:2,x:857,y:138,r:63,o:45,q:['JD08','JD06','JD05','JD07']},
 {id:'p09',nome:'Pivô 09',area:1,x:773,y:203,r:115,o:35,q:['RU56','RU54','RU55','RU57']},
 {id:'p10',nome:'Pivô 10',area:1,x:610,y:96,r:80,o:123,q:['RU58','RU59']}];

// ---------- utilidades ----------
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function md(v){if(v==null||!isFinite(v))return '—';return (Math.round(v*100)/100).toLocaleString('pt-BR',{maximumFractionDigits:2});}
function nf(n,d){if(n==null||!isFinite(n))return '—';return Number(n).toLocaleString('pt-BR',{minimumFractionDigits:d||0,maximumFractionDigits:d||0});}
function f1(n){return nf(n,1);}
function num(v){if(v==null)return null;var s=String(v).trim().replace(/\s/g,'');if(!s)return null;if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');var x=Number(s);return isFinite(x)?x:null;}
function pad(n){return ('0'+n).slice(-2);}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function nowHM(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());}
function fd(iso){if(!iso)return '—';var p=iso.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function fds(iso){if(!iso)return '';var p=iso.split('-');return p[2]+'/'+p[1];}
function dias(a,b){return Math.round((Date.parse(b+'T12:00:00')-Date.parse(a+'T12:00:00'))/864e5);}
function addDias(iso,n){var d=new Date(Date.parse(iso+'T12:00:00')+n*864e5);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function uid(p){return (p||'')+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function ic(id,c){return '<svg class="'+(c||'i')+'" aria-hidden="true"><use href="#'+id+'"/></svg>';}
var MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
var toastT;
function toast(m,k){var t=$('toast');t.textContent=m;t.hidden=false;t.style.background=k==='crit'?'var(--crit)':'';clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;},k==='crit'?6000:3500);}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}

// IndexedDB simples (rascunho, pendências, fotos no modo local)
var idbP=null;
function idb(){if(idbP)return idbP;idbP=new Promise(function(res){try{var q=indexedDB.open('irrigamanager-app',1);q.onupgradeneeded=function(){q.result.createObjectStore('kv');};q.onsuccess=function(){res(q.result);};q.onerror=function(){res(null);};}catch(e){res(null);}});return idbP;}
function kvGet(k){return idb().then(function(d){if(!d)return null;return new Promise(function(res){try{var r=d.transaction('kv').objectStore('kv').get(k);r.onsuccess=function(){res(r.result==null?null:r.result);};r.onerror=function(){res(null);};}catch(e){res(null);}});});}
function kvSet(k,v){return idb().then(function(d){if(!d)return false;return new Promise(function(res){try{var t=d.transaction('kv','readwrite');if(v==null)t.objectStore('kv').delete(k);else t.objectStore('kv').put(v,k);t.oncomplete=function(){res(true);};t.onerror=function(){res(false);};}catch(e){res(false);}});});}

// ---------- estado e dados ----------
var COLS=['pivos','avaliacoes','leituras','cfg','checklists','pendencias','aspersores','manutencoes','ocorrencias','irrigacoes','irr_hist','irr_arq'];
var D={pivos:{},avaliacoes:{},leituras:{},cfg:{},checklists:{},pendencias:{},aspersores:{},manutencoes:{},ocorrencias:{},irrigacoes:{},irr_hist:{},irr_arq:{}};
var S={mode:'loading',stale:false,ro:false,view:'mapa',sel:null,selT:0,area:1,ed:false,uP:null,uA:null,pend:[],userName:'',userId:null,cfmDel:null,cP:null,cA:null,ckEdit:null,canEdit:false,aP:null,aspS:null,aspTamp:false,aspOff:false,aspM:'v',aspIn:'',aspVao:1,tP:null,tMode:'p',ctEdit:null};
var DB=null,ASSETS=null,DL=null,USER=null;
var P=[],A=[],L=[],C=[],PD=[],MT=[],OC=[],CFG=Object.assign({},CFG0),FOTO={tipo:'aval'};

function derive(){
 P=Object.keys(D.pivos).map(function(id){return Object.assign({id:id},D.pivos[id]);}).sort(function(a,b){return String(a.nome).localeCompare(String(b.nome),'pt-BR',{numeric:true});});
 A=Object.keys(D.avaliacoes).map(function(id){return Object.assign({id:id},D.avaliacoes[id]);}).sort(function(a,b){return (a.data+a.hora)<(b.data+b.hora)?-1:1;});
 L=Object.keys(D.leituras).map(function(id){return Object.assign({id:id},D.leituras[id]);}).sort(function(a,b){return a.data<b.data?-1:a.data>b.data?1:(a.h-b.h);});
 C=Object.keys(D.checklists).map(function(id){return Object.assign({id:id},D.checklists[id]);}).sort(function(a,b){return (a.data+a.hora)<(b.data+b.hora)?-1:1;});
 PD=Object.keys(D.pendencias).map(function(id){return Object.assign({id:id},D.pendencias[id]);}).sort(function(a,b){return a.criada<b.criada?-1:1;});
 MT=Object.keys(D.manutencoes||{}).map(function(id){return Object.assign({id:id},D.manutencoes[id]);}).sort(function(a,b){return a.data<b.data?-1:a.data>b.data?1:((a.horim||0)-(b.horim||0))||(a.criado<b.criado?-1:1);});
 OC=Object.keys(D.ocorrencias||{}).map(function(id){return Object.assign({id:id},D.ocorrencias[id]);}).sort(function(a,b){return a.data<b.data?-1:a.data>b.data?1:(a.criado<b.criado?-1:1);});
 CFG=Object.assign({},CFG0,D.cfg.geral||{});STC={};IRC=null;
 if(!S.sel||!pv(S.sel))S.sel=P[0]?P[0].id:null;
 if(S.uP&&!pv(S.uP))S.uP=null;
}
function pv(id){for(var i=0;i<P.length;i++)if(P[i].id===id)return P[i];return null;}
function avalsDe(pid){return A.filter(function(a){return a.pivo===pid;});}
function leitDe(pid){return L.filter(function(l){return l.pivo===pid;});}

var LKEY='irrigamanager-local-v1';
function localLoad(){var j=null;try{j=JSON.parse(lsGet(LKEY)||'null');}catch(e){}
 if(j){COLS.forEach(function(c){if(j[c])D[c]=j[c];});}
 if(!Object.keys(D.pivos).length){DEF_PIVOS.forEach(function(p){var o=Object.assign({},p);delete o.id;o.fazenda=AREA[o.area];o.laminaRec=10;o.ativo=true;D.pivos[p.id]=o;});localSave();}
 if(!Object.keys(D.aspersores||{}).length&&ASP_EST){D.aspersores=JSON.parse(JSON.stringify(ASP_EST));localSave();}
 if(!Object.keys(D.irr_hist||{}).length&&IRR_HIST){D.irr_hist=JSON.parse(JSON.stringify(IRR_HIST.hist));D.irr_arq=JSON.parse(JSON.stringify(IRR_HIST.arq));localSave();}}
function localSave(){if(!lsSet(LKEY,JSON.stringify(D)))toast('Não foi possível salvar neste navegador','crit');}

function withTimeout(p,ms){return new Promise(function(res,rej){var t=setTimeout(function(){rej({code:'timeout',message:'Sem resposta do servidor'});},ms);p.then(function(v){clearTimeout(t);res(v);},function(e){clearTimeout(t);rej(e);});});}
function dbErr(e){if(e&&e.code==='invalid_argument'){S.ro=true;schedule();}throw e;}
function put(c,id,o){
 if(S.mode==='db')return withTimeout(DB.collection(c).doc(id).set(o),15000).catch(dbErr);
 if(c==='fotos')return kvSet('foto:'+id,o.img);
 D[c][id]=o;localSave();derive();schedule();return Promise.resolve();
}
function del(c,id){
 if(S.mode==='db')return withTimeout(DB.collection(c).doc(id).delete(),15000).catch(dbErr);
 if(c==='fotos')return kvSet('foto:'+id,null);
 delete D[c][id];localSave();derive();schedule();return Promise.resolve();
}
function errMsg(e){var c=e&&e.code;return c==='invalid_argument'?'Seu acesso a esta página é só de leitura.':c==='quota_exceeded'?'O espaço de dados da página está cheio.':c==='timeout'||c==='unavailable'?'Sem conexão com o servidor.':'Não foi possível salvar ('+(c||'erro')+').';}

function startLocal(why){S.mode='local';S.canEdit=true;localLoad();derive();schedule();}
function startDb(db){
 DB=db;S.mode='db';var got={};
 var t=setTimeout(function(){S.stale=true;schedule();},10000);
 COLS.forEach(function(c){
  db.collection(c).onSnapshot(function(s){
   var m={};s.docs.forEach(function(d){m[d.id]=d.data();});D[c]=m;
   if(c==='aspersores'&&s.docs.length){S.aspOff=false;kvSet('aspCache',m);}
   if(!s.metadata.fromCache){got[c]=1;if(Object.keys(got).length===COLS.length){clearTimeout(t);S.stale=false;}}
   derive();schedule();
  },function(e){clearTimeout(t);toast('Não foi possível ler os dados ('+e.code+').','crit');});
 });
 derive();schedule();
 setTimeout(enviarPendentes,1500);
}
function boot(){
 kvGet('aspCache').then(function(v){if(v&&S.mode!=='local'&&!Object.keys(D.aspersores).length){D.aspersores=v;S.aspOff=true;schedule();}});
 kvGet('pend').then(function(v){S.pend=v||[];schedule();});
 if(!window.claude||typeof window.claude.use!=='function'){startLocal();return;}
 window.claude.use('db').then(function(db){if(db)startDb(db);else startLocal();},function(){startLocal();});
 window.claude.use('assets').then(function(a){ASSETS=a;},function(){});
 window.claude.use('downloads').then(function(d){DL=d;},function(){});
 window.claude.use('user').then(function(u){USER=u;if(!u)return;u.id().then(function(i){S.userId=i;});u.name().then(function(n){S.userName=n||'';});u.canEdit().then(function(v){S.canEdit=!!v;schedule();});},function(){});
}

function stPill(r){return '<span class="pill '+r.st+'">'+esc(r.txt)+'</span>';}

// ---------- cálculos da uniformidade ----------
function area(diam){return Math.PI*Math.pow(diam/2,2);}
function mmDe(vol,diam){return vol==null?null:vol*1000/area(diam);}
function calc(a){
 var rec=a.rec||CFG.laminaRec,fx=(a.faixa||CFG.faixa)/100,lo=rec*(1-fx),hi=rec*(1+fx),pts=[],per=0,sem=0;
 for(var i=0;i<a.n;i++){var c=(a.col||[])[i]||{},dist=a.d1+i*a.ds;
  if(c.perdido){per++;continue;} if(c.vol==null){sem++;continue;}
  pts.push({k:i+1,dist:dist,mm:mmDe(c.vol,a.diam),vol:c.vol});}
 var r={rec:rec,lo:lo,hi:hi,pts:pts,nl:pts.length,per:per,sem:sem,n:a.n};
 if(pts.length<2)return r;
 var W=0,SX=0,SX2=0,m=0;pts.forEach(function(p){var w=p.dist>0?p.dist:0.0001;p.w=w;W+=w;SX+=w*p.mm;m+=p.mm;});
 var mw=SX/W,ms=m/pts.length,dw=0,ds=0,vw=0;
 pts.forEach(function(p){dw+=p.w*Math.abs(p.mm-mw);ds+=Math.abs(p.mm-ms);vw+=p.w*Math.pow(p.mm-mw,2);p.st=p.mm<lo?'crit':p.mm>hi?'warn':'ok';});
 r.mean=mw;r.meanS=ms;r.cuh=100*(1-dw/SX);r.cuc=100*(1-ds/(pts.length*ms));r.cv=100*Math.sqrt(vw/W)/mw;
 var so=pts.slice().sort(function(a,b){return a.mm-b.mm;}),tg=W/4,acc=0,s=0;
 for(i=0;i<so.length&&acc<tg;i++){var tk=Math.min(so[i].w,tg-acc);s+=tk*so[i].mm;acc+=tk;}
 r.cud=100*(s/acc)/mw;
 r.abaixo=pts.filter(function(p){return p.st==='crit';});r.acima=pts.filter(function(p){return p.st==='warn';});r.out=r.abaixo.length+r.acima.length;
 return r;
}
function cls(c){return c==null?['mut','—']:c>=90?['ok','Excelente']:c>=80?['ok','Bom']:c>=70?['warn','Razoável']:['crit','Ruim'];}
function cp(c){var k=cls(c);return '<span class="pill '+k[0]+'">'+k[1]+'</span>';}
function leitura(a,r,ant){
 var t=[];if(r.nl<2)return ['Há poucos coletores com leitura para calcular os coeficientes.'];
 t.push(r.out?r.out+' de '+r.nl+' coletores ficaram fora da faixa de ±'+nf(a.faixa||CFG.faixa)+'% da lâmina recomendada ('+r.abaixo.length+' abaixo, '+r.acima.length+' acima).':'Todos os '+r.nl+' coletores ficaram dentro da faixa de ±'+nf(a.faixa||CFG.faixa)+'% da lâmina recomendada.');
 if(r.abaixo.length>1){var ds=r.abaixo.map(function(p){return p.dist;});t.push('Lâmina abaixo da faixa entre '+md(Math.min.apply(0,ds))+' e '+md(Math.max.apply(0,ds))+' m do centro.');}
 var dif=(r.mean/r.rec-1)*100;t.push('Lâmina média de '+f1(r.mean)+' mm contra '+f1(r.rec)+' mm recomendada ('+(dif>=0?'+':'−')+f1(Math.abs(dif))+'%): '+(dif<-5?'aplicou menos que o recomendado.':dif>5?'aplicou mais que o recomendado.':'próxima do recomendado.'));
 t.push(r.cuh<80?'Vale revisar bocais, pressão e sobreposição no trecho com lâmina baixa antes da próxima irrigação.':r.cuh<90?'Resultado aceitável; acompanhe o trecho fora da faixa na próxima avaliação.':'Uniformidade excelente; mantenha a rotina de preventiva.');
 if(a.vento!=null&&a.vento>CFG.ventoMax)t.push('Vento de '+f1(a.vento)+' m/s, acima do limite de '+f1(CFG.ventoMax)+' m/s: o vento distorce a coleta; considere repetir a avaliação em condição mais calma.');
 if(r.per)t.push(r.per>1?r.per+' coletores perdidos ficaram fora do cálculo.':'1 coletor perdido ficou fora do cálculo.');
 if(ant){var ra=calc(ant);if(ra.cuh!=null)t.push('Em relação à avaliação de '+fd(ant.data)+', o CUC '+(r.cuh>=ra.cuh?'subiu ':'caiu ')+f1(Math.abs(r.cuh-ra.cuh))+' ponto(s).');}
 return t;
}

// ---------- gráficos ----------
function barras(a,r,W,H){
 W=W||720;H=H||240;var l=36,rt=8,t=14,b=30,n=a.n,bw=(W-l-rt)/n,mx=Math.max(r.hi*1.25,Math.max.apply(0,r.pts.map(function(p){return p.mm;}).concat([1]))*1.08),
 Y=function(v){return t+(mx-v)/mx*(H-t-b);},sk=Math.max(1,Math.ceil(n/8));
 var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Lâmina coletada por distância do centro"><rect x="'+l+'" y="'+Y(r.hi)+'" width="'+(W-l-rt)+'" height="'+(Y(r.lo)-Y(r.hi))+'" fill="var(--ok)" fill-opacity=".12"/><text x="4" y="12" font-size="11" fill="var(--tx3)">mm</text>';
 var step=mx>16?5:mx>8?4:2;for(var v=0;v<=mx;v+=step)s+='<line x1="'+l+'" x2="'+(W-rt)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--ln)"/><text x="'+(l-6)+'" y="'+(Y(v)+4)+'" font-size="11" text-anchor="end" fill="var(--tx3)">'+v+'</text>';
 var byK={};r.pts.forEach(function(p){byK[p.k]=p;});
 for(var i=0;i<n;i++){var p=byK[i+1],x=l+i*bw;
  if(p)s+='<rect x="'+(x+bw*.15).toFixed(1)+'" y="'+Y(p.mm).toFixed(1)+'" width="'+(bw*.7).toFixed(1)+'" height="'+(Y(0)-Y(p.mm)).toFixed(1)+'" rx="2" fill="var(--'+p.st+')"><title>Coletor '+(i+1)+' · '+md(a.d1+i*a.ds)+' m · '+f1(p.mm)+' mm</title></rect>';
  else s+='<text x="'+(x+bw/2)+'" y="'+(Y(0)-4)+'" font-size="11" text-anchor="middle" fill="var(--tx3)">×</text>';
  if(i%sk===0||(i===n-1&&(n-1)%sk>=sk/2))s+='<text x="'+(i===n-1&&n>1?x+bw:x+bw/2)+'" y="'+(H-10)+'" font-size="11" text-anchor="'+(i===n-1&&n>1?'end':'middle')+'" fill="var(--tx3)">'+md(a.d1+i*a.ds)+' m</text>';}
 return s+'<line x1="'+l+'" x2="'+(W-rt)+'" y1="'+Y(r.rec)+'" y2="'+Y(r.rec)+'" stroke="var(--tx2)" stroke-dasharray="5 4"/></svg>';
}
function historico(lst,selId){
 var W=440,H=230,l=34,rt=14,t=14,b=30,n=lst.length,X=function(i){return n<2?(l+W-rt)/2:l+i*(W-l-rt)/(n-1);},mn=Math.min(50,Math.floor(Math.min.apply(0,lst.map(function(x){return Math.min(x.r.cuh||100,x.r.cud||100);}))/10)*10),Y=function(v){return t+(100-v)/(100-mn)*(H-t-b);};
 var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Histórico de CUC e CUD">';
 for(var v=mn;v<=100;v+=10)s+='<line x1="'+l+'" x2="'+(W-rt)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--ln)"/><text x="'+(l-6)+'" y="'+(Y(v)+4)+'" font-size="11" text-anchor="end" fill="var(--tx3)">'+v+'</text>';
 [[80,'Bom'],[90,'Excelente']].forEach(function(q){s+='<line x1="'+l+'" x2="'+(W-rt)+'" y1="'+Y(q[0])+'" y2="'+Y(q[0])+'" stroke="var(--ok)" stroke-dasharray="4 4"/><text x="'+(W-rt-2)+'" y="'+(Y(q[0])-4)+'" font-size="10" text-anchor="end" fill="var(--ok)">'+q[1]+'</text>';});

var MTF=null;
function abrirMt(pid,tid){var p=pv(pid)||P.filter(function(x){return x.ativo!==false;})[0];if(!p){toast('Cadastre um pivô primeiro.');return;}
 MTF={id:uid('m'),pivo:p.id,data:today(),horim:'',tar:{},vals:{},resp:S.userName||'',obs:'',fotos:[]};if(tid)MTF.tar[tid]=true;
 var hm=horimEm(p.id,MTF.data);if(hm)MTF.horim=String(hm.h);mrender();
 if(tid)setTimeout(function(){var e=document.getElementById('mt-'+tid);if(e)e.scrollIntoView({block:'center'});},60);}
function fecharMt(){MTF=null;$('wiz').innerHTML='';$('wiz').onclick=null;$('wiz').oninput=null;$('wiz').onchange=null;}
function mrender(keep){
 var p=pv(MTF.pivo),cm=CTM(),n=Object.keys(MTF.tar).filter(function(k){return MTF.tar[k];}).length,hm=horimEm(MTF.pivo,MTF.data);
 var wb=document.querySelector('#wiz .wbody'),sc=keep&&wb?wb.scrollTop:0;
 var h='<div class="wiz"><div class="wz" role="dialog" aria-modal="true" aria-label="Registrar manutenção"><div class="wbar"><div><small>Cartilha · registrar manutenção</small><b>'+esc(p?p.nome:'')+' · '+fd(MTF.data)+'</b></div><button class="x" data-mx="1" aria-label="Fechar sem salvar">✕</button></div><div class="wbody">';
 h+='<div class="fg"><label class="fl full">Pivô<select id="mP">'+pivoOpts(MTF.pivo)+'</select></label><label class="fl">Data<input id="mD" type="date" value="'+esc(MTF.data)+'"></label><label class="fl">Horímetro (h)<input id="mH" inputmode="decimal" autocomplete="off" value="'+esc(MTF.horim)+'"></label></div>';
 h+='<p class="note" id="mHi">'+(hm?'Última leitura até esta data: '+nf(hm.h)+' h em '+fd(hm.data)+'. Se o horímetro estiver diferente, digite: o app salva também como leitura.':'Sem leitura do horímetro deste pivô: digite o valor para o app contar as horas das tarefas.')+'</p>';
 h+='<div class="prog"><span><b>Tarefas feitas</b></span><span id="mN">'+n+' marcada'+(n===1?'':'s')+'</span></div><div class="acts"><button class="b2" data-m="venc">Marcar vencidas e próximas</button><button class="b2" data-m="todas">Marcar todas</button>'+(n?'<button class="lk" data-m="nenhuma">Desmarcar</button>':'')+'</div>';
 secsDe(cm).forEach(function(sec){h+='<div class="h5">'+esc(sec)+'</div><div class="mtl">';
  cm.filter(function(t){return t.sec===sec;}).forEach(function(t){var on=!!MTF.tar[t.id],r=p?stTarefa(p,t):null;
   h+='<div class="mti'+(on?' on':'')+'" id="mt-'+esc(t.id)+'"><label class="mtc"><input type="checkbox" data-mt="'+esc(t.id)+'"'+(on?' checked':'')+'><span>'+esc(t.t)+'<small>'+esc(perTxt(t))+(t.lig?' · pivô ligado':'')+(r?' · '+esc(r.txt):'')+'</small></span></label>'+(on&&t.un?'<label class="fl"><span>'+esc(t.unl||'Valor medido')+' <small>('+esc(t.un)+')</small></span><input data-mv="'+esc(t.id)+'" id="mv-'+esc(t.id)+'" inputmode="decimal" autocomplete="off" value="'+esc(MTF.vals[t.id]==null?'':String(MTF.vals[t.id]).replace('.',','))+'"></label>':'')+'</div>';});
  h+='</div>';});
 h+='<div class="h5">Fechamento</div><label class="fl">Verificado por<input id="mR" value="'+esc(MTF.resp)+'" autocomplete="name" maxlength="80"></label><label class="fl">Observação<textarea id="mO" maxlength="600">'+esc(MTF.obs)+'</textarea></label>';
 h+='<div class="thumbs">'+MTF.fotos.map(function(f,k){return '<img src="'+f+'" alt="Foto '+(k+1)+' da manutenção">';}).join('')+'</div><div class="acts">'+(MTF.fotos.length<3?'<button class="b2" data-m="foto">'+ic('cam')+(MTF.fotos.length?'Mais uma foto':'Tirar foto')+'</button>':'')+(MTF.fotos.length?'<button class="lk" data-m="fdel">Apagar fotos</button>':'')+'</div><p class="note" id="mMsg"></p>';
 h+='</div><div class="wfoot"><div class="r"><button class="b2" data-mx="1">Cancelar</button><button class="b1" data-m="salvar" id="mOk">Salvar registro</button></div></div></div></div>';
 $('wiz').innerHTML=h;$('wiz').onclick=mclick;$('wiz').oninput=minput;$('wiz').onchange=mchange;

function mmsg(m,k){var e=$('mMsg');if(e){e.className='note '+(k||'crit');e.textContent=m;e.scrollIntoView({block:'nearest'});}}
function minput(e){var t=e.target,v=t.getAttribute('data-mv');if(v){MTF.vals[v]=num(t.value);return;}if(t.id==='mH')MTF.horim=t.value;if(t.id==='mR')MTF.resp=t.value;if(t.id==='mO')MTF.obs=t.value;}
function mchange(e){var t=e.target,id=t.getAttribute('data-mt');if(id){MTF.tar[id]=t.checked;if(!t.checked)delete MTF.vals[id];mrender(true);return;}
 if(t.id==='mP'||t.id==='mD'){var old=horimEm(MTF.pivo,MTF.data);if(t.id==='mP')MTF.pivo=t.value;else MTF.data=t.value||today();var hm=horimEm(MTF.pivo,MTF.data);if(!MTF.horim||(old&&String(old.h)===String(MTF.horim)))MTF.horim=hm?String(hm.h):'';mrender(true);}}
function mclick(e){var b=e.target.closest('[data-m],[data-mx]');if(!b)return;if(b.getAttribute('data-mx')){fecharMt();return;}
 var a=b.getAttribute('data-m'),p=pv(MTF.pivo),cm=CTM();
 if(a==='todas'){cm.forEach(function(t){MTF.tar[t.id]=true;});mrender(true);return;}
 if(a==='nenhuma'){MTF.tar={};MTF.vals={};mrender(true);return;}
 if(a==='venc'){var k=0;cm.forEach(function(t){var r=stTarefa(p,t);if(r.st==='crit'||r.st==='warn'){MTF.tar[t.id]=true;k++;}});mrender(true);if(!k)mmsg('Nenhuma tarefa vencida ou próxima neste pivô.','');return;}
 if(a==='foto'){FOTO={tipo:'mt'};$('fotoIn').value='';$('fotoIn').click();return;}
 if(a==='fdel'){MTF.fotos=[];mrender(true);return;}
 if(a==='salvar')salvarMt();}
function salvarMt(){
 var cm=CTM(),ids=cm.filter(function(t){return MTF.tar[t.id];}).map(function(t){return t.id;}),resp=String(MTF.resp||'').trim(),dt=MTF.data,h=num(MTF.horim);
 if(!ids.length)return mmsg('Marque as tarefas feitas.');
 if(!dt)return mmsg('Informe a data.');
 if(dt>today())return mmsg('A data não pode ser futura.');
 var precisaH=cm.some(function(t){return MTF.tar[t.id]&&t.h;});
 if(String(MTF.horim||'').trim()&&(h==null||h<0))return mmsg('Confira o horímetro.');
 if(precisaH&&h==null)return mmsg('Informe o horímetro: há tarefa marcada que conta por horas.');
 if(h!=null){var bad=leitDe(MTF.pivo).filter(function(l){return (l.data<=dt&&l.h>h)||(l.data>dt&&l.h<h);})[0];if(bad)return mmsg('O horímetro não bate com a leitura de '+fd(bad.data)+' ('+nf(bad.h)+' h). Confira o valor ou a data.');}
 var semV=cm.filter(function(t){return MTF.tar[t.id]&&t.un&&MTF.vals[t.id]==null;})[0];if(semV)return mmsg('Informe '+(semV.unl||'o valor medido').toLowerCase()+' em “'+semV.t+'”.');
 if(!resp)return mmsg('Informe quem verificou.');
 var vals={};ids.forEach(function(id){if(MTF.vals[id]!=null)vals[id]=MTF.vals[id];});
 var doc={pivo:MTF.pivo,data:dt,horim:h,tarefas:ids,itens:cm.filter(function(t){return MTF.tar[t.id];}).map(function(t){var o={id:t.id,sec:t.sec,t:t.t};if(t.un)o.un=t.un;return o;}),vals:vals,resp:resp,obs:String(MTF.obs||'').trim(),fotos:[],porId:S.userId||null,criado:new Date().toISOString()};
 var hm=horimEm(MTF.pivo,dt),leit=h!=null&&!(hm&&hm.data===dt&&hm.h===h)&&!leitDe(MTF.pivo).some(function(l){return l.data===dt&&l.h===h;})?{id:MTF.id+'-h',doc:{pivo:MTF.pivo,data:dt,h:h,obs:'Manutenção (cartilha)',porId:S.userId||null,criado:new Date().toISOString()}}:null;
 var item={kind:'mt',id:MTF.id,mt:doc,fotos:MTF.fotos.map(function(f,n){return {k:n+1,img:f};}),leit:leit};
 var btn=$('mOk');btn.disabled=true;btn.textContent='Salvando…';
 enviarMt(item).then(function(){fimMt(item,'Manutenção registrada.');},function(e){
  if(e&&(e.code==='invalid_argument'||e.code==='quota_exceeded')){btn.disabled=false;btn.textContent='Salvar registro';mmsg(errMsg(e));return;}
  S.pend=S.pend.concat([item]);kvSet('pend',S.pend);fimMt(item,'Sem conexão: o registro ficou guardado no aparelho e será enviado quando houver sinal.');});}
function fimMt(item,msg){fecharMt();S.view='ct';S.tP=item.mt.pivo;S.sel=item.mt.pivo;S.tMode='p';toast(msg);schedule();window.scrollTo(0,0);}
function enviarMt(item){var seq=Promise.resolve();
 item.fotos.forEach(function(f){seq=seq.then(function(){if(f.ref)return;return salvarFoto(item.id,f).then(function(ref){f.ref=ref;});});});
 return seq.then(function(){if(item.leit&&!item.leit.ok)return put('leituras',item.leit.id,item.leit.doc).then(function(){item.leit.ok=true;});})
 .then(function(){item.mt.fotos=item.fotos.filter(function(f){return f.ref;}).map(function(f){return f.ref;});return put('manutencoes',item.id,item.mt);});}
